name: 百聆（bailing） 
version: 1.0

logging:
  level: debug

# 唤醒词
WakeWord: 百聆

interrupt: true
# 是否开启工具调用
StartTaskMode: true
# 具体处理时选择的模块
selected_module:
  Recorder: RecorderPyAudio
  ASR: FunASR
  VAD: SileroVAD
  LLM: OpenAILLM
  TTS: KOKOROTTS
  Player: PyaudioPlayer

Recorder:
  RecorderPyAudio:
    output_file: tmp/
  WebSocketRecorder:
    output_file: tmp/


ASR:
  FunASR:
    model_dir: models/SenseVoiceSmall
    output_file: tmp/

VAD:
  SileroVAD:
    sampling_rate: 16000
    threshold: 0.5
    min_silence_duration_ms: 200  # 如果说话停顿比较长，可以把这个值设置大一些

LLM:
  OpenAILLM:
    model_name: deepseek-chat
    url: http://127.0.0.1:8080
    api_key: 12345
  OllamaLLM:
    model_name: qwen-chat
    url: http://127.0.0.1:8080 # 注意后缀是api/chat
    api_key: 12345


TTS:
  MacTTS:
    voice: Tingting
    output_file: tmp/
  EdgeTTS:
    voice: zh-CN-XiaoxiaoNeural
    output_file: tmp/
  GTTS:
    lang: zh
    output_file: tmp/
  CosyvoiceTTS:
    output_file: tmp/
  CHATTTS:
    output_file: tmp/
  KOKOROTTS:
    output_file: tmp/
    lang: z
    voice: zf_001
    repo_id: models/ckpts/kokoro-v1.1

Player:
  PygameSoundPlayer: null
  PygamePlayer: null
  CmdPlayer: null
  PyaudioPlayer: null
  WebSocketPlayer: null

Rag:
  doc_path: documents/
  emb_model: models/bge-small-zh
  model_name: deepseek-chat
  url: http://127.0.0.1:8080
  api_key: 12345

Memory:
  dialogue_history_path: tmp/
  memory_file: tmp/memory.json
  model_name: deepseek-chat
  url: http://127.0.0.1:8080
  api_key: 12345

TaskManager:
  functions_call_name: plugins/function_calls_config.json
  aigc_enabled: false





